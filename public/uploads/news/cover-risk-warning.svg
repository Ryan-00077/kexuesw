<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-4" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="50%" stop-color="#200a0e"/>
      <stop offset="100%" stop-color="#0f0406"/>
    </linearGradient>
    <linearGradient id="hub-grad-4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1216" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0a0c" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid-pattern-4" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-grad-4)"/>
  <rect x="620" y="40" width="600" height="520" fill="url(#grid-pattern-4)"/>
  
  <g transform="translate(64, 52)">
    <rect x="0" y="4" width="5" height="24" rx="2.5" fill="#f43f5e"/>
    <text x="18" y="23" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5">科学上网 · Node</text>
  </g>

  <text x="64" y="210" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-1">节点风险与跑路预警</text>
  <text x="64" y="260" fill="#f43f5e" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="3.5">RISK ALERT &amp; MONITORING</text>

  <text x="64" y="325" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" letter-spacing="0.5">异常监测  /  资金链排查  /  避险指南</text>
  <text x="64" y="375" fill="#e2e8f0" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="20">官网失联 · 突发大促 · 专线掐线诊断</text>

  <!-- Right Risk Radar / Shield Diagram -->
  <g transform="translate(80, 0)">
    <!-- Circuit lines -->
    <path d="M 720 260 H 790 V 350 H 860" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 980 350 H 1020 V 240 H 1050" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1020 350 V 450 H 1050" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="790" cy="260" r="5" fill="#fda4af"/>
    <circle cx="790" cy="350" r="5" fill="#fda4af"/>
    <circle cx="1020" cy="240" r="5" fill="#fda4af"/>
    <circle cx="1020" cy="350" r="5" fill="#fda4af"/>
    <circle cx="1020" cy="450" r="5" fill="#fda4af"/>

    <!-- Risk Alert Radar Icon -->
    <rect x="640" y="215" width="80" height="80" rx="18" fill="url(#hub-grad-4)" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 680 235 L 702 272 H 658 Z" fill="none" stroke="#fda4af" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="680" cy="264" r="1.5" fill="#fda4af"/>
    <line x1="680" y1="248" x2="680" y2="258" stroke="#fda4af" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Central Shield Node -->
    <rect x="860" y="295" width="120" height="100" rx="24" fill="url(#hub-grad-4)" stroke="#f43f5e" stroke-width="2.5"/>
    <rect x="870" y="305" width="100" height="80" rx="16" fill="rgba(244, 63, 94, 0.12)"/>
    <text x="898" y="345" fill="#fda4af" font-family="'PingFang SC', sans-serif" font-weight="900" font-size="20">避险</text>
    <text x="888" y="370" fill="#fb7185" font-family="Inter, sans-serif" font-weight="700" font-size="14">WARNING</text>

    <!-- Signal Node 1 -->
    <rect x="1050" y="200" width="70" height="70" rx="16" fill="url(#hub-grad-4)" stroke="rgba(251, 113, 133, 0.5)" stroke-width="1.5"/>
    <text x="1066" y="242" fill="#fda4af" font-family="'PingFang SC', sans-serif" font-weight="800" font-size="16">失联</text>

    <!-- Signal Node 2 -->
    <rect x="1050" y="415" width="70" height="70" rx="16" fill="url(#hub-grad-4)" stroke="rgba(251, 113, 133, 0.5)" stroke-width="1.5"/>
    <text x="1066" y="457" fill="#fda4af" font-family="'PingFang SC', sans-serif" font-weight="800" font-size="16">断流</text>
  </g>

  <line x1="64" y1="580" x2="1216" y2="580" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="64" y="630" fill="#64748b" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="16">预警雷达 / 存活快照 / 资产隔离</text>
  <text x="1216" y="630" text-anchor="end" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1">科学上网 · Node 实验室</text>
</svg>