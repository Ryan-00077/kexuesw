<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-1" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hub-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid-pattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bg-grad-1)"/>
  
  <!-- Right Grid Background -->
  <rect x="620" y="40" width="600" height="520" fill="url(#grid-pattern)"/>
  
  <!-- Top Left Brand -->
  <g transform="translate(64, 52)">
    <rect x="0" y="4" width="5" height="24" rx="2.5" fill="#06b6d4"/>
    <text x="18" y="23" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5">科学上网 · Node</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="210" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-1">代理技术动态</text>
  <text x="64" y="260" fill="#06b6d4" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="3.5">PROXY TECH BRIEF</text>

  <!-- Tags -->
  <text x="64" y="325" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" letter-spacing="0.5">Xray  /  sing-box  /  mihomo  /  Hysteria 2</text>
  
  <!-- Description -->
  <text x="64" y="375" fill="#e2e8f0" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="20">协议更新 · 网络安全 · 内核观察</text>

  <!-- Right Topology Diagram -->
  <g id="topology" transform="translate(60, 0)">
    <!-- Circuit Lines -->
    <path d="M 750 250 H 810 V 350 H 870" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 970 350 H 1020 V 230 H 1050" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1020 350 V 440 H 1050" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pulse Dots -->
    <circle cx="810" cy="250" r="5" fill="#38bdf8"/>
    <circle cx="810" cy="350" r="5" fill="#38bdf8"/>
    <circle cx="1020" cy="230" r="5" fill="#38bdf8"/>
    <circle cx="1020" cy="350" r="5" fill="#38bdf8"/>
    <circle cx="1020" cy="440" r="5" fill="#38bdf8"/>

    <!-- Terminal Node (Left) -->
    <rect x="670" y="205" width="80" height="80" rx="18" fill="url(#hub-grad)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="696" y="254" fill="#38bdf8" font-family="Consolas, monospace" font-weight="700" font-size="26">&gt;_</text>

    <!-- Core Hub Node (Center) -->
    <rect x="870" y="295" width="100" height="100" rx="24" fill="url(#hub-grad)" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="878" y="303" width="84" height="84" rx="16" fill="rgba(6, 182, 212, 0.08)"/>
    <text x="898" y="356" fill="#06b6d4" font-family="Consolas, monospace" font-weight="800" font-size="28">&lt;/&gt;</text>

    <!-- Top Target Node -->
    <rect x="1050" y="190" width="70" height="70" rx="16" fill="url(#hub-grad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <line x1="1066" y1="217" x2="1104" y2="217" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="1066" y1="233" x2="1092" y2="233" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Target Node -->
    <rect x="1050" y="405" width="70" height="70" rx="16" fill="url(#hub-grad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <line x1="1066" y1="432" x2="1104" y2="432" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="1066" y1="448" x2="1086" y2="448" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="64" y1="580" x2="1216" y2="580" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Bottom Metadata -->
  <text x="64" y="630" fill="#64748b" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="16">技术追踪 / 版本解读 / 深度评测</text>
  <text x="1216" y="630" text-anchor="end" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1">科学上网 · Node 实验室</text>
</svg>