    <rect x="850" y="295" width="110" height="100" rx="24" fill="url(#hub-grad-2)" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="860" y="305" width="90" height="80" rx="16" fill="rgba(59, 130, 246, 0.1)"/>
    <text x="880" y="354" fill="#60a5fa" font-family="'PingFang SC', sans-serif" font-weight="900" font-size="22">分流</text>

