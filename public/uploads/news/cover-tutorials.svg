<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b1328"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="hub-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid-pattern-2" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-grad-2)"/>
  <rect x="620" y="40" width="600" height="520" fill="url(#grid-pattern-2)"/>
  
  <g transform="translate(64, 52)">
    <rect x="0" y="4" width="5" height="24" rx="2.5" fill="#3b82f6"/>
    <text x="18" y="23" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5">科学上网 · Node</text>
  </g>

  <text x="64" y="210" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-1">客户端配置与使用教程</text>
  <text x="64" y="260" fill="#3b82f6" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="3.5">CLIENT SETUP &amp; TUTORIAL</text>

  <text x="64" y="325" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" letter-spacing="0.5">PassWall  /  Clash Verge  /  Shadowrocket  /  Surge</text>
  <text x="64" y="375" fill="#e2e8f0" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="20">配置覆写 · 软路由接入 · 防 DNS 泄漏</text>

  <!-- Right Client Devices Topology -->
  <g transform="translate(80, 0)">
