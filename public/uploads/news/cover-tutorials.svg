    <rect x="1050" y="415" width="70" height="70" rx="16" fill="url(#hub-grad-2)" stroke="rgba(96, 165, 250, 0.5)" stroke-width="1.5"/>
    <rect x="1066" y="430" width="38" height="26" rx="4" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <line x1="1085" y1="456" x2="1085" y2="464" stroke="#93c5fd" stroke-width="2"/>
    <line x1="1075" y1="464" x2="1095" y2="464" stroke="#93c5fd" stroke-width="2"/>
