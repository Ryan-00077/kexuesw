    <path d="M 720 250 H 800 V 345 H 850" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 970 345 H 1010 V 240 H 1050" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1010 345 V 450 H 1050" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="800" cy="250" r="5" fill="#93c5fd"/>
    <circle cx="800" cy="345" r="5" fill="#93c5fd"/>
    <circle cx="1010" cy="240" r="5" fill="#93c5fd"/>
    <circle cx="1010" cy="345" r="5" fill="#93c5fd"/>
    <circle cx="1010" cy="450" r="5" fill="#93c5fd"/>

    <!-- Router Node -->
    <rect x="640" y="205" width="80" height="80" rx="18" fill="url(#hub-grad-2)" stroke="#60a5fa" stroke-width="2"/>
    <path d="M 660 255 L 700 255 M 670 240 L 690 240 M 665 230 C 675 220 685 220 695 230" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>

