<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-ai" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="ai-purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ai-cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid-pattern-ai" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bg-grad-ai)"/>
  
  <!-- Right Grid Background -->
  <rect x="620" y="40" width="600" height="520" fill="url(#grid-pattern-ai)"/>
  
  <!-- Top Left Brand -->
  <g transform="translate(64, 52)">
    <rect x="0" y="4" width="5" height="24" rx="2.5" fill="#8b5cf6"/>
    <text x="18" y="23" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5">科学上网 · Node</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="210" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-1">AI 与前沿技术动态</text>
  <text x="64" y="260" fill="#a78bfa" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="3.5">AI &amp; TECH FRONTIER BRIEF</text>

  <!-- Tags -->
  <text x="64" y="325" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" letter-spacing="0.5">GPT-6  /  Claude Opus 5.5  /  DeepSeek  /  Autonomous Agents</text>
  
  <!-- Description -->
  <text x="64" y="375" fill="#e2e8f0" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="20">模型架构 · 智能体工作流 · 算力观察</text>

  <!-- Right AI Neural Node Topology -->
  <g id="ai-network" transform="translate(60, 0)">
    <!-- Circuit Lines -->
    <path d="M 750 250 H 840 V 350 H 900" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 980 350 H 1040 V 230 H 1080" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1040 350 V 440 H 1080" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Central Agent Hub Node -->
    <rect x="900" y="305" width="80" height="90" rx="16" fill="#1e1b4b" stroke="url(#ai-purple-glow)" stroke-width="2.5"/>
    <text x="940" y="358" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">&lt;AI&gt;</text>
    
    <!-- Secondary Nodes -->
    <rect x="670" y="210" width="80" height="80" rx="14" fill="#0f172a" stroke="#4338ca" stroke-width="2"/>
    <text x="710" y="258" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">Agent</text>
    
    <rect x="1080" y="190" width="80" height="80" rx="14" fill="#0f172a" stroke="#7c3aed" stroke-width="2"/>
    <text x="1120" y="238" fill="#c084fc" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">1M</text>
    
    <rect x="1080" y="400" width="80" height="80" rx="14" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <text x="1120" y="448" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">LLM</text>
    
    <!-- Pulse Dots -->
    <circle cx="840" cy="250" r="5" fill="#a78bfa"/>
    <circle cx="840" cy="350" r="5" fill="#a78bfa"/>
    <circle cx="1040" cy="230" r="5" fill="#a78bfa"/>
    <circle cx="1040" cy="440" r="5" fill="#10b981"/>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="64" y1="560" x2="1216" y2="560" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <!-- Footer Metadata -->
  <text x="64" y="620" fill="#94a3b8" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="16">模型评测  /  Agent 实践  /  全球 AI 观察</text>
  <text x="1216" y="620" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="600" font-size="16" text-anchor="end">科学上网 · Node 实验室</text>
</svg>

