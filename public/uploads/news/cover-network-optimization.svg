<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-3" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0818"/>
      <stop offset="50%" stop-color="#120e28"/>
      <stop offset="100%" stop-color="#080612"/>
    </linearGradient>
    <linearGradient id="hub-grad-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#100d24" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid-pattern-3" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg-grad-3)"/>
  <rect x="620" y="40" width="600" height="520" fill="url(#grid-pattern-3)"/>
  
  <g transform="translate(64, 52)">
    <rect x="0" y="4" width="5" height="24" rx="2.5" fill="#8b5cf6"/>
    <text x="18" y="23" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5">科学上网 · Node</text>
  </g>

  <text x="64" y="210" fill="#ffffff" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-1">跨境网络路线深度解析</text>
  <text x="64" y="260" fill="#a855f7" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="18" letter-spacing="3.5">NETWORK OPTIMIZATION</text>

  <text x="64" y="325" fill="#94a3b8" font-family="Inter, -apple-system, sans-serif" font-weight="500" font-size="18" letter-spacing="0.5">CN2 GIA  /  BGP  /  IEPL  /  IPLC 专线</text>
  <text x="64" y="375" fill="#e2e8f0" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="20">内网专线 · 骨干直连 · TLS 指纹伪装</text>

  <!-- Right Fiber Optic & Private Line Diagram -->
  <g transform="translate(80, 0)">
    <!-- Circuit lines -->
    <path d="M 720 260 H 790 V 350 H 860" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 980 350 H 1020 V 240 H 1050" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 1020 350 V 450 H 1050" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="790" cy="260" r="5" fill="#c084fc"/>
    <circle cx="790" cy="350" r="5" fill="#c084fc"/>
    <circle cx="1020" cy="240" r="5" fill="#c084fc"/>
    <circle cx="1020" cy="350" r="5" fill="#c084fc"/>
    <circle cx="1020" cy="450" r="5" fill="#c084fc"/>

    <!-- Domestic Ingress -->
    <rect x="640" y="215" width="80" height="80" rx="18" fill="url(#hub-grad-3)" stroke="#a855f7" stroke-width="2"/>
    <text x="662" y="262" fill="#c084fc" font-family="'PingFang SC', sans-serif" font-weight="800" font-size="18">国内段</text>

    <!-- Dedicated Tunnel Hub -->
    <rect x="860" y="295" width="120" height="100" rx="24" fill="url(#hub-grad-3)" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="870" y="305" width="100" height="80" rx="16" fill="rgba(139, 92, 246, 0.12)"/>
    <text x="892" y="345" fill="#c084fc" font-family="Inter, sans-serif" font-weight="900" font-size="20">IEPL</text>
    <text x="888" y="370" fill="#94a3b8" font-family="'PingFang SC', sans-serif" font-weight="700" font-size="14">二层内网</text>

    <!-- Overseas Egress 1 -->
    <rect x="1050" y="200" width="70" height="70" rx="16" fill="url(#hub-grad-3)" stroke="rgba(192, 132, 252, 0.5)" stroke-width="1.5"/>
    <text x="1066" y="242" fill="#c084fc" font-family="'PingFang SC', sans-serif" font-weight="800" font-size="16">香港</text>

    <!-- Overseas Egress 2 -->
    <rect x="1050" y="415" width="70" height="70" rx="16" fill="url(#hub-grad-3)" stroke="rgba(192, 132, 252, 0.5)" stroke-width="1.5"/>
    <text x="1066" y="457" fill="#c084fc" font-family="'PingFang SC', sans-serif" font-weight="800" font-size="16">日本</text>
  </g>

  <line x1="64" y1="580" x2="1216" y2="580" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="64" y="630" fill="#64748b" font-family="'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif" font-weight="600" font-size="16">路由追踪 / 延迟测速 / 链路透视</text>
  <text x="1216" y="630" text-anchor="end" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1">科学上网 · Node 实验室</text>
</svg>